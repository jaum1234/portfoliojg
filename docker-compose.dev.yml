services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - /usr/src/app/node_modules
      - ./frontend:/usr/src/app
      - site-build:/usr/src/app/_site
    ports:
      - "8080:8080"
    env_file:
      - ./frontend/.env.development
    depends_on:
      - backend


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - /usr/src/app/node_modules
      - ./backend:/usr/src/app
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.development

  nginx:
    image: nginx:1.28
    ports:
      - "80:80"
    volumes:
      - ./nginx.development.conf:/etc/nginx/conf.d/default.conf:ro
      - site-build:/usr/src/app/_site:ro
    depends_on:
      - frontend
      - backend

volumes:
  site-build: